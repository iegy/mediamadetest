<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="page_title_files">Files · Media Made</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="Media Made" class="brand-logo">
        <span class="brand-word" data-i18n="brand">Media Made</span>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Main navigation"></nav>

      <div class="sidebar-spacer"></div>

      <div class="user-card">
        <div class="user-avatar" aria-hidden="true"></div>
        <div class="user-meta">
          <span id="user-name" class="user-name">—</span>
          <span id="user-role" class="user-role">—</span>
        </div>
      </div>
      <button id="lang-toggle-side" class="lang-toggle" type="button" style="width:100%; margin-top:10px;" data-i18n="lang_switch">English</button>
      <button id="logout-btn" class="btn-ghost" type="button" data-i18n="btn_logout">تسجيل الخروج</button>

      <footer class="credit-footer credit-footer--sidebar">
        Designed &amp; Developed by Mohammed Hussein · <a href="https://iegy.net/" target="_blank" rel="noopener">iegy.net</a> ©
      </footer>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 data-i18n="page_title_files">الملفات</h1>
      </header>

      <section class="content">
        <div class="toolbar">
          <input id="search-input" class="search-input" type="text" data-i18n-placeholder="search_files" placeholder="ابحث باسم الملف أو العميل...">
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th data-i18n="label_file_name">اسم الملف</th>
                <th data-i18n="th_client">العميل</th>
                <th data-i18n="th_service">الخدمة</th>
                <th data-i18n="th_upload_date">تاريخ الرفع</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="files-tbody">
              <tr class="empty-row"><td colspan="5">...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="files.js"></script>
</body>
</html>
