<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="page_title_followup">Follow-ups · Media Made</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="Media Made" class="brand-logo">
        <span class="brand-word" data-i18n="brand">Media Made</span>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Main navigation"></nav>

      <div class="sidebar-spacer"></div>

      <div class="user-card">
        <div class="user-avatar" aria-hidden="true"></div>
        <div class="user-meta">
          <span id="user-name" class="user-name">—</span>
          <span id="user-role" class="user-role">—</span>
        </div>
      </div>
      <button id="lang-toggle-side" class="lang-toggle" type="button" style="width:100%; margin-top:10px;" data-i18n="lang_switch">English</button>
      <button id="logout-btn" class="btn-ghost" type="button" data-i18n="btn_logout">تسجيل الخروج</button>

      <footer class="credit-footer credit-footer--sidebar">
        Designed &amp; Developed by Mohammed Hussein · <a href="https://iegy.net/" target="_blank" rel="noopener">iegy.net</a> ©
      </footer>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 data-i18n="page_title_followup">المتابعات</h1>
      </header>

      <section class="content">
        <div class="toolbar">
          <input id="search-input" class="search-input" type="text" data-i18n-placeholder="search_followup" placeholder="ابحث بالاسم أو رقم الهاتف...">
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th data-i18n="th_name">اسم العميل</th>
                <th data-i18n="th_last_followup">آخر متابعة</th>
                <th data-i18n="th_last_notes">ملاحظات آخر تواصل</th>
                <th data-i18n="th_next_followup">المتابعة القادمة</th>
                <th data-i18n="th_next_step">الخطوة القادمة</th>
                <th data-i18n="th_owner">المسؤول</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="followup-tbody">
              <tr class="empty-row"><td colspan="7">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal: تحديث سريع للمتابعة -->
  <div id="followup-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <h2 id="modal-title" data-i18n="modal_title_update_followup">تحديث المتابعة</h2>
      <form id="followup-form" novalidate>
        <input type="hidden" id="client-id">
        <div class="field-grid">
          <div class="field">
            <label for="f-last-date" data-i18n="label_last_followup_date">تاريخ آخر متابعة</label>
            <input type="date" id="f-last-date">
          </div>
          <div class="field">
            <label for="f-next-date" data-i18n="label_next_followup_date">تاريخ المتابعة القادمة</label>
            <input type="date" id="f-next-date">
          </div>
          <div class="field field--full">
            <label for="f-last-notes" data-i18n="label_last_followup_notes">ملاحظات آخر تواصل</label>
            <textarea id="f-last-notes"></textarea>
          </div>
          <div class="field field--full">
            <label for="f-next-step" data-i18n="label_next_step">الخطوة القادمة</label>
            <input type="text" id="f-next-step">
          </div>
        </div>
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn-secondary" data-i18n="btn_cancel">إلغاء</button>
          <button type="submit" id="save-btn" class="btn-primary" data-i18n="btn_save">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="followup.js"></script>
</body>
</html>
