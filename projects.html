<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="page_title_projects">Projects · Media Made</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="Media Made" class="brand-logo">
        <span class="brand-word" data-i18n="brand">Media Made</span>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Main navigation"></nav>

      <div class="sidebar-spacer"></div>

      <div class="user-card">
        <div class="user-avatar" aria-hidden="true"></div>
        <div class="user-meta">
          <span id="user-name" class="user-name">—</span>
          <span id="user-role" class="user-role">—</span>
        </div>
      </div>
      <button id="lang-toggle-side" class="lang-toggle" type="button" style="width:100%; margin-top:10px;" data-i18n="lang_switch">English</button>
      <button id="logout-btn" class="btn-ghost" type="button" data-i18n="btn_logout">تسجيل الخروج</button>

      <footer class="credit-footer credit-footer--sidebar">
        Designed &amp; Developed by Mohammed Hussein · <a href="https://iegy.net/" target="_blank" rel="noopener">iegy.net</a> ©
      </footer>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 data-i18n="page_title_projects">المشاريع</h1>
      </header>

      <section class="content">
        <div class="toolbar">
          <input id="search-input" class="search-input" type="text" data-i18n-placeholder="search_projects" placeholder="ابحث باسم العميل أو الخدمة...">
          <button id="add-project-btn" class="btn-primary btn-primary--inline" type="button" data-i18n="btn_add_project">+ مشروع جديد</button>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th data-i18n="th_client">العميل</th>
                <th data-i18n="th_service">الخدمة</th>
                <th data-i18n="th_project_value">القيمة</th>
                <th data-i18n="th_shoot_date">تاريخ التصوير</th>
                <th data-i18n="th_delivery_date">تاريخ التسليم</th>
                <th data-i18n="th_status">الحالة</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="projects-tbody">
              <tr class="empty-row"><td colspan="7">...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal: إضافة / تعديل مشروع -->
  <div id="project-modal" class="modal-backdrop" hidden>
    <div class="modal-card" style="max-width:600px;">
      <h2 id="modal-title" data-i18n="modal_title_new_project">مشروع جديد</h2>
      <form id="project-form" novalidate>
        <input type="hidden" id="project-id">
        <div class="field-grid">
          <div class="field field--full">
            <label for="f-client" data-i18n="label_client_select">العميل *</label>
            <select id="f-client" required>
              <option value="" data-i18n="option_choose_client">اختر العميل...</option>
            </select>
          </div>
          <div class="field">
            <label for="f-service" data-i18n="label_service">الخدمة</label>
            <input type="text" id="f-service">
          </div>
          <div class="field">
            <label for="f-value" data-i18n="label_project_value">قيمة المشروع</label>
            <input type="number" id="f-value" min="0">
          </div>
          <div class="field">
            <label for="f-owner" data-i18n="label_owner">المسؤول عن العميل</label>
            <select id="f-owner">
              <option value="" data-i18n="option_no_owner">بدون تحديد</option>
            </select>
          </div>
          <div class="field">
            <label for="f-status" data-i18n="label_project_status">حالة المشروع</label>
            <select id="f-status"></select>
          </div>
          <div class="field">
            <label for="f-start-date" data-i18n="label_start_date">تاريخ البداية</label>
            <input type="date" id="f-start-date">
          </div>
          <div class="field">
            <label for="f-shoot-date" data-i18n="label_shoot_date">تاريخ التصوير</label>
            <input type="date" id="f-shoot-date">
          </div>
          <div class="field">
            <label for="f-delivery-date" data-i18n="label_delivery_date">تاريخ التسليم</label>
            <input type="date" id="f-delivery-date">
          </div>
          <div class="field">
            <label for="f-location" data-i18n="label_shoot_location">مكان التصوير</label>
            <input type="text" id="f-location">
          </div>
          <div class="field field--full">
            <label for="f-team" data-i18n="label_team">الفريق المسؤول</label>
            <select id="f-team" multiple size="4"></select>
            <p style="font-size:12px; color:var(--ink-muted); margin:4px 0 0;" data-i18n="hint_team_multiselect">اختار أكتر من واحد بالضغط مع Ctrl/Cmd</p>
          </div>
          <div class="field">
            <label for="f-editing-status" data-i18n="label_editing_status">حالة المونتاج</label>
            <select id="f-editing-status"></select>
          </div>
        </div>
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn-secondary" data-i18n="btn_cancel">إلغاء</button>
          <button type="submit" id="save-btn" class="btn-primary" data-i18n="btn_save">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="projects.js"></script>
</body>
</html>
