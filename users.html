<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-title="page_title_users">Users &amp; Permissions · Media Made</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="Media Made" class="brand-logo">
        <span class="brand-word" data-i18n="brand">Media Made</span>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Main navigation"></nav>

      <div class="sidebar-spacer"></div>

      <div class="user-card">
        <div class="user-avatar" aria-hidden="true"></div>
        <div class="user-meta">
          <span id="user-name" class="user-name">—</span>
          <span id="user-role" class="user-role">—</span>
        </div>
      </div>
      <button id="lang-toggle-side" class="lang-toggle" type="button" style="width:100%; margin-top:10px;" data-i18n="lang_switch">English</button>
      <button id="logout-btn" class="btn-ghost" type="button" data-i18n="btn_logout">تسجيل الخروج</button>

      <footer class="credit-footer credit-footer--sidebar">
        by Ronadisa
      </footer>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 data-i18n="page_title_users">المستخدمون والصلاحيات</h1>
      </header>

      <section class="content">
        <div class="toolbar">
          <span></span>
          <button id="add-user-btn" class="btn-primary btn-primary--inline" type="button" data-i18n="btn_add_user">+ إضافة مستخدم</button>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th data-i18n="label_user_name">الاسم</th>
                <th data-i18n="label_email">البريد الإلكتروني</th>
                <th data-i18n="th_role">الدور</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr class="empty-row"><td colspan="4">...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal: إضافة / تعديل مستخدم -->
  <div id="user-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <h2 id="modal-title" data-i18n="modal_title_new_user">مستخدم جديد</h2>
      <form id="user-form" novalidate>
        <input type="hidden" id="user-id">
        <div class="field-grid">
          <div class="field field--full">
            <label for="f-name" data-i18n="label_user_name">الاسم *</label>
            <input type="text" id="f-name" required>
          </div>
          <div class="field field--full">
            <label for="f-email" data-i18n="label_email">البريد الإلكتروني</label>
            <input type="email" id="f-email">
            <p style="font-size:11.5px; color:var(--ink-muted); margin:4px 0 0;" data-i18n="hint_email_must_match">لازم يطابق نفس إيميل تسجيل الدخول الحقيقي بتاع الشخص ده.</p>
          </div>
          <div class="field field--full" id="password-field">
            <label for="f-password" data-i18n="label_initial_password">كلمة مرور مبدئية</label>
            <input type="text" id="f-password">
          </div>
          <div class="field field--full">
            <label for="f-role" data-i18n="label_role">الدور</label>
            <select id="f-role">
              <option value="management" data-i18n="role_management">الإدارة</option>
              <option value="client_management" data-i18n="role_client_management">إدارة العملاء</option>
              <option value="sales" data-i18n="role_sales">المبيعات</option>
              <option value="production" data-i18n="role_production">الإنتاج</option>
              <option value="editor" data-i18n="role_editor">المونتاج</option>
            </select>
          </div>
        </div>
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn-secondary" data-i18n="btn_cancel">إلغاء</button>
          <button type="submit" id="save-btn" class="btn-primary" data-i18n="btn_save">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="users.js"></script>
</body>
</html>
