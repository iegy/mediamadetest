<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العملاء · Media Made</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-word">Media Made</span>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav" aria-label="القائمة الرئيسية"></nav>

      <div class="sidebar-spacer"></div>

      <div class="user-card">
        <div class="user-avatar" aria-hidden="true"></div>
        <div class="user-meta">
          <span id="user-name" class="user-name">—</span>
          <span id="user-role" class="user-role">—</span>
        </div>
      </div>
      <button id="logout-btn" class="btn-ghost" type="button">تسجيل الخروج</button>

      <footer class="credit-footer credit-footer--sidebar">
        Designed &amp; Developed by Mohammed Hussein · <a href="https://iegy.net/" target="_blank" rel="noopener">iegy.net</a> ©
      </footer>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1>العملاء</h1>
      </header>

      <section class="content">
        <div class="toolbar">
          <input id="search-input" class="search-input" type="text" placeholder="ابحث بالاسم أو رقم الهاتف أو الخدمة...">
          <button id="add-client-btn" class="btn-primary btn-primary--inline" type="button">+ عميل جديد</button>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>اسم العميل</th>
                <th>الهاتف</th>
                <th>الخدمة</th>
                <th>الحالة</th>
                <th>المسؤول</th>
                <th>أول تواصل</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="clients-tbody">
              <tr class="empty-row"><td colspan="7">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal: إضافة / تعديل عميل -->
  <div id="client-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <h2 id="modal-title">عميل جديد</h2>
      <form id="client-form" novalidate>
        <input type="hidden" id="client-id">
        <div class="field-grid">
          <div class="field field--full">
            <label for="f-name">اسم العميل *</label>
            <input type="text" id="f-name" required>
          </div>
          <div class="field">
            <label for="f-phone">رقم الهاتف</label>
            <input type="tel" id="f-phone">
          </div>
          <div class="field">
            <label for="f-type">نوع العميل</label>
            <input type="text" id="f-type" placeholder="فرد / شركة / عيادة...">
          </div>
          <div class="field field--full">
            <label for="f-company">اسم الشركة / العيادة (إن وجد)</label>
            <input type="text" id="f-company">
          </div>
          <div class="field">
            <label for="f-service">الخدمة المطلوبة</label>
            <input type="text" id="f-service">
          </div>
          <div class="field">
            <label for="f-source">مصدر العميل</label>
            <input type="text" id="f-source" placeholder="سوشيال ميديا / ترشيح / ...">
          </div>
          <div class="field">
            <label for="f-owner">المسؤول عن العميل</label>
            <select id="f-owner">
              <option value="">بدون تحديد</option>
            </select>
          </div>
          <div class="field">
            <label for="f-status">حالة العميل</label>
            <select id="f-status"></select>
          </div>
          <div class="field">
            <label for="f-date">تاريخ أول تواصل</label>
            <input type="date" id="f-date">
          </div>
          <div class="field field--full">
            <label for="f-notes">ملاحظات</label>
            <textarea id="f-notes"></textarea>
          </div>
          <div class="field field--full" style="border-top:1px solid var(--border); padding-top:12px; margin-top:2px;">
            <label style="font-weight:700; color:var(--ink);">المتابعة</label>
          </div>
          <div class="field">
            <label for="f-last-followup-date">تاريخ آخر متابعة</label>
            <input type="date" id="f-last-followup-date">
          </div>
          <div class="field">
            <label for="f-next-followup-date">تاريخ المتابعة القادمة</label>
            <input type="date" id="f-next-followup-date">
          </div>
          <div class="field field--full">
            <label for="f-last-followup-notes">ملاحظات آخر تواصل</label>
            <textarea id="f-last-followup-notes"></textarea>
          </div>
          <div class="field field--full">
            <label for="f-next-step">الخطوة القادمة</label>
            <input type="text" id="f-next-step">
          </div>
        </div>
        <p id="form-error" class="form-error" role="alert"></p>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn-secondary">إلغاء</button>
          <button type="submit" id="save-btn" class="btn-primary">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="clients.js"></script>
</body>
</html>
