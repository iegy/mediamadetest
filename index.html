<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول · Media Made</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word">Media Made</span>
    </div>
    <h1>تسجيل الدخول</h1>
    <p class="auth-sub">نظام إدارة العملاء والمشاريع الداخلي</p>

    <form id="login-form" novalidate>
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" required autocomplete="current-password">

      <p id="login-error" class="form-error" role="alert"></p>

      <button type="submit" id="login-submit" class="btn-primary">تسجيل الدخول</button>
    </form>
  </main>

  <footer class="credit-footer">
    Designed &amp; Developed by Mohammed Hussein · <a href="https://iegy.net/" target="_blank" rel="noopener">iegy.net</a> ©
  </footer>

  <script type="module" src="login.js"></script>
</body>
</html>
