<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرئيسية · Media Made</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-word">Media Made</span>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav" aria-label="القائمة الرئيسية"></nav>

      <div class="sidebar-spacer"></div>

      <div class="user-card">
        <div class="user-avatar" aria-hidden="true"></div>
        <div class="user-meta">
          <span id="user-name" class="user-name">—</span>
          <span id="user-role" class="user-role">—</span>
        </div>
      </div>
      <button id="logout-btn" class="btn-ghost" type="button">تسجيل الخروج</button>

      <footer class="credit-footer credit-footer--sidebar">
        Designed &amp; Developed by Mohammed Hussein · <a href="https://iegy.net/" target="_blank" rel="noopener">iegy.net</a> ©
      </footer>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1>الرئيسية</h1>
      </header>

      <section class="content">
        <div class="placeholder-grid">
          <div class="placeholder-card">
            <span class="placeholder-label">العملاء الحاليين</span>
            <span id="stat-clients" class="placeholder-value">—</span>
          </div>
          <div class="placeholder-card">
            <span class="placeholder-label">المشاريع الجارية</span>
            <span class="placeholder-value">—</span>
          </div>
          <div class="placeholder-card">
            <span class="placeholder-label">المتابعات المستحقة</span>
            <span class="placeholder-value">—</span>
          </div>
          <div class="placeholder-card">
            <span class="placeholder-label">المبالغ المستحقة</span>
            <span class="placeholder-value">—</span>
          </div>
        </div>
        <p class="content-note">هيتم ربط الأرقام دي فعليًا بـ Firestore في مرحلة الـ Dashboard، بعد ما نبني موديولات العملاء والمشاريع والمدفوعات.</p>
      </section>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
